pluginManagement {
    repositories {
        // Prefer local vendored plugins / MDG artifacts when present.
        maven {
            name = 'theseusLocal'
            url = uri("${rootDir}/local-maven")
        }
        maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        gradlePluginPortal()
        mavenCentral()
        // Official last — weak networks hang here for minutes.
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Theseus'
