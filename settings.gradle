pluginManagement {
    repositories {
        // Prefer local vendored plugins / MDG artifacts when present.
        maven {
            name = 'theseusLocal'
            url = uri("${rootDir}/local-maven")
        }
        maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        gradlePluginPortal()
        mavenCentral()
        // Official last — weak networks hang here for minutes.
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Optional machine-local overrides (proxy, JDK paths). Never commit gradle-local.properties.
def localPropsFile = new File(rootDir, 'gradle-local.properties')
if (localPropsFile.exists()) {
    def localProps = new Properties()
    localPropsFile.withInputStream { localProps.load(it) }
    localProps.each { key, value ->
        def k = key.toString()
        def v = value.toString()
        if (k.startsWith('systemProp.')) {
            System.setProperty(k.substring('systemProp.'.length()), v)
        } else {
            startParameter.projectProperties.put(k, v)
        }
    }
}

rootProject.name = 'Theseus'
